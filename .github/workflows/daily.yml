name: daily-pipeline
on:
  schedule:
    - cron: "45 21 * * 1-5"     # 21:45 UTC ≈ after US close (16:45 ET summer); Mon-Fri
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "reuse cached panels (debug)"
        default: "false"
  push:
    branches: [main]
    paths:                       # shakedown: code/config pushes trigger a full run;
      - "src/**"                 # bot data commits don't match these paths, so no loops
      - "config/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}

      - name: Restore data panels (heavy, gitignored)
        uses: actions/cache@v4
        with:
          path: |
            data/panels
            data/cache
          key: panels-${{ github.run_id }}
          restore-keys: panels-

      - name: Install
        run: pip install -e .

      - name: Run daily pipeline
        id: pipeline
        continue-on-error: true    # failures still get committed below, then re-raised
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ]; then
            sigc daily --skip-fetch 2>&1 | tee run_output.log
          else
            sigc daily 2>&1 | tee run_output.log
          fi

      - name: Render dashboard
        if: steps.pipeline.outcome == 'success'
        run: sigc render

      - name: Preserve run log in repo (also on failure)
        if: always()
        run: |
          mkdir -p data/reports/ci_logs
          {
            echo "run: ${{ github.run_id }} outcome: ${{ steps.pipeline.outcome }} $(date -u +%FT%TZ)"
            tail -n 300 run_output.log 2>/dev/null || echo "no output captured"
            cat data/build/runlog-*.jsonl 2>/dev/null | tail -n 100 || true
          } > "data/reports/ci_logs/$(date -u +%F)-run${{ github.run_id }}.log"
          ls data/reports/ci_logs | head -50

      - name: Ledger immutability guard
        run: python scripts/check_ledger_immutable.py origin/main HEAD || true
        # informational pre-commit; the enforcing run is in ci.yml on the diff we push

      - name: Commit results
        if: always()
        run: |
          git config user.name "signal-council-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger data/reports data/calibration data/filings_cache \
                  data/watchlist.json data/watchlist_history.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F) [${{ steps.pipeline.outcome }}]"
          git pull --rebase origin main
          git push

      - name: Re-raise pipeline failure
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
